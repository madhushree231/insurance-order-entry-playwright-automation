name: Playwright tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      OE_AGENT_EMAIL: ${{ secrets.OE_AGENT_EMAIL }}
      OE_AGENT_PASSWORD: ${{ secrets.OE_AGENT_PASSWORD }}
      OE_SEED_PASSWORD: ${{ secrets.OE_SEED_PASSWORD }}
      OE_AGENT2_EMAIL: agent.draft@insurance.test
      OE_SUBMITTED_EMAIL: agent.submitted@insurance.test
      OE_LOCKED_EMAIL: agent.locked@insurance.test
      OE_NEW_AGENT_EMAIL: agent.new@insurance.test
      OE_MFA_EMAIL: agent.mfa@insurance.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Smoke
        run: npx playwright test --grep @smoke
      - name: Regression
        if: always()
        run: npx playwright test --grep @regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/
          retention-days: 14
